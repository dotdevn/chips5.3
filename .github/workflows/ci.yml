name: Rails checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      PARALLEL_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rails db:prepare
      - run: bundle exec rails test
